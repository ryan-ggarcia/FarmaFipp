<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Carrinho - FarmeFipp</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background: linear-gradient(to right, #e3f2fd, #fce4ec);">

  <header class="navbar navbar-expand-lg bg-white border-bottom sticky-top shadow-sm">
    <div class="container">
<a class="navbar-brand logo" href="/index.html">FarmeFipp</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir navegação">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav">
          </ul>

        <form class="d-flex pesquisa mx-auto" role="search" id="formPesquisa">
          <input class="form-control me-2" type="search" placeholder="Busque medicamentos..." aria-label="Buscar" id="inputPesquisa">
          <button class="btn btn-outline-danger" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </form>


            
            <a href="carrinho.html" class="btn btn-carrinho position-relative" role="button" title="Ver Carrinho">
               <i class="bi bi-cart3 fs-5"></i>
               <span class="d-none d-lg-inline ms-1">Carrinho</span>
               <span class="badge bg-danger rounded-pill ms-1" id="cart-count">0</span>
            </a>
        </div>
      </div>
    </div>
  </header>
  
  <main class="container my-5">
    <div class="row">
        
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h2 class="mb-4">Meu Carrinho</h2>
                    
                    <div id="cart-items-container">
                        </div>

                    <div id="empty-cart-message" class="text-center text-muted d-none">
                        <i class="bi bi-cart-x" style="font-size: 4rem;"></i>
                        <h4 class="mt-3">Seu carrinho está vazio.</h4>
                        <p>Volte para a loja e adicione alguns produtos!</p>
                        <a href="/index.html" class="btn btn-primary">Voltar para a Loja</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="mb-3">Resumo</h3>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">R$ 0,00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Frete</span>
                        <span class="text-success">Grátis</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
                        <span>Total</span>
                        <span id="cart-total">R$ 0,00</span>
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-success btn-lg">Finalizar Compra</button>
                        <button class="btn btn-outline-danger" id="clear-cart-button">Limpar Carrinho</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </main>

  <footer class="footer mt-4">
      </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script src="carrinho.js"></script>
</body>
</html>
