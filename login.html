<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FarmaFipp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

  <div class="card p-4 shadow-lg" style="max-width:400px; width:100%">
    <h2 class="text-center text-danger mb-4">Login</h2>
    <form>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail ou CPF</label>
        <input type="text" class="form-control" id="email" placeholder="Digite seu email ou CPF">
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <div class="input-group">
          <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
          <span class="input-group-text"><i class="fas fa-eye"></i></span>
        </div>
      </div>
      <button type="submit" class="btn btn-danger w-100 mb-3">Entrar</button>
      <div class="text-center mb-3"><a href="#">Esqueci a senha</a></div>
      <div class="text-center text-muted my-2">Outros métodos de entrada</div>
      <div class="d-flex justify-content-center gap-3 mb-3">
        <button class="btn btn-outline-primary"><i class="fab fa-facebook-f"></i></button>
        <button class="btn btn-outline-dark"><i class="fab fa-apple"></i></button>
        <button class="btn btn-outline-danger"><i class="fab fa-google"></i></button>
      </div>
      <div class="text-center">Não tem conta? <a href="cadastro.html">Cadastre-se</a></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
