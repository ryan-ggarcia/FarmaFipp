<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FarmaFipp</title>
  <link rel="stylesheet" href="../css/form.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.3/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="../css/style.css">

</head>

<body class="login-page">

  <div class="card p-4 p-md-5 shadow-lg login-card" style="max-width:450px; width:90%">
    <h2 class="text-center text-danger mb-4 fw-bold">Login</h2>
    <form id="form">
      <div class="mb-3">
        <label for="email" class="form-label">Usuário</label>
        <input type="text" class="form-control" id="emailLogin" placeholder="Digite seu email ou CPF">
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="Digite sua senha">
          <span class="input-group-text" style="cursor: pointer;"><i class="fas fa-eye"></i></span>
        </div>
      </div>
      <button type="submit" class="btn btn-login w-100 mb-3" onclick="validarInput()">Entrar</button>

      <div class="text-center mb-3 forgot"><a href="#">Esqueci a senha</a></div>

      <div class="divider d-flex align-items-center my-3">
        <hr class="flex-grow-1">
        <span class="px-3">ou</span>
        <hr class="flex-grow-1">
      </div>

      <div class="d-flex justify-content-center gap-3 mb-3">
        <a href="https...facebook..." target="_blank" class="btn btn-login-social">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="https...apple..." target="_blank" class="btn btn-login-social">
          <i class="fab fa-apple"></i>
        </a>
        <a href="https...google..." target="_blank" class="btn btn-login-social">
          <i class="fab fa-google"></i>
        </a>
      </div>

      <div class="text-center mt-4">Não tem conta? <a href="cadastro.html" class="fw-bold text-danger">Cadastre-se</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById("form")
    form.addEventListener("submit", (e) => {
      e.preventDefault()
      validarLogin()
    })
    function validarLogin() {
      let usuario = document.getElementById("emailLogin")
      let senha = document.getElementById("password")
      if (usuario.value.trim() === "" || senha.value === "") {
        Swal.fire({
          icon: "error",
          title: "Usuário ou senha incorretos!",
          text: "Verifique se todos os campos preenchidos estão corretos!",
        });
        usuario.style.border = "red 1px solid"
        senha.style.border = "red 1px solid"
      } else {
        if (!usuario.value === "admin" && !senha.value === "admin") {
          Swal.fire({
            title: "Login bem sucedido!",
            icon: "success",
            draggable: true
          }).then(() => {
            window.location.href = "../index.html"; // redireciona depois do alerta
          });
        }
        Swal.fire({
            title: "Uau! Temos um administrador na área!",
            text:"Seja muito bem vindo",
            icon: "success",
            draggable: true
          }).then(() => {
            window.location.href = "addProdutos.html"; // redireciona depois do alerta
          });

      }
    }
  </script>
</body>

</html>
