<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" 
    crossorigin="anonymous" 
    referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
</head>
<body>

   
<header id="header-cad">
   <div class="logo">
            <a href="index.html">FarmaFipp</a>
        </div>
    <div class="info-cad">
        <div class="central">
            <i class="fas fa-headset"></i> Central de atendimento
          </div>
          
          <div class="seguro">
            <i class="fas fa-shield-halved"></i> AMBIENTE 100% SEGURO
          </div>
    </div>
  </header>
  
  <div class="container">
    <div class="top">
      <h2><i class="fas fa-user"></i> nova conta</h2>
      <button class="btn-login">Já tenho cadastro</button>
    </div>
  
    <form>
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Ex.: Josefa Santos">
      </div>
  
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="exemplo@exemplo.com.br">
      </div>
  
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00">
      </div>
  
      <div class="form-group">
        <label for="celular">Celular</label>
        <input type="tel" id="celular" placeholder="(00) 00000-0000">
      </div>
  
      <div class="form-group">
        <label for="nascimento">Data de Nascimento</label>
        <input type="text" id="nascimento" placeholder="dd/mm/aaaa">
      </div>
  
      <div class="form-group radio">
        <label><input type="radio" name="genero"> Masculino</label>
        <label><input type="radio" name="genero"> Feminino</label>
      </div>
  
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite uma senha">
      </div>
  
      <div class="form-group">
        <label for="confirmar">Confirmar Senha</label>
        <input type="password" id="confirmar" placeholder="Repita a senha">
      </div>
      <br>
      
      <div class="form-actions">
        <button type="button" class="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn-confirmar">Confirmar</button>
      </div>
      
    </form>
  </div>
  
  </body>
  </html>
