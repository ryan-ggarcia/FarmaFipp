<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - FarmaFipp</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="
https://cdn.jsdelivr.net/npm/sweetalert2@11.26.3/dist/sweetalert2.min.css
" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <header id="header-cad" class="d-flex justify-content-between align-items-center p-3 bg-light">
    <a class="logo navbar-brand" href="index.html" style="font-size: 2rem;">FarmaFipp</a>
    <div class="info-cad d-flex gap-4">
      <div><i class="fas fa-headset"></i> Central de Atendimento</div>
      <div><i class="fas fa-shield-halved"></i> Ambiente 100% Seguro</div>
    </div>
  </header>

  <div class="container my-5">
    <div class="top d-flex justify-content-between align-items-center mb-4">
      <h2><i class="fas fa-user"></i> Nova Conta</h2>
      <button class="btn btn-outline-primary" onclick="window.location.href='login.html'">Já tenho cadastro</button>
    </div>

    <form id="formCadastro" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" class="form-control" id="nome" onblur="validaNome(nome)" required>
        </div>
        <div class="col-md-6">
          <label for="sobrenome" class="form-label">Sobrenome</label>
          <input type="text" class="form-control" id="sobrenome" onblur="validaNome(sobrenome)" required>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">E-mail</label>
          <input type="text" class="form-control" id="email" onblur="validaEmail(email)" required>
        </div>

        <div class="col-md-6">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" 
            onkeypress="mascara('###.###.###-##', this, event, true)" onblur="validaCpf(cpf)">
        </div>
        <div class="col-md-6">
          <label for="celular" class="form-label">Celular</label>
          <input type="text" class="form-control" id="celular" placeholder="(00) 00000-0000"
            onblur="validaCelular(celular)" onkeypress="mascara('(##) #####-####', this, event, true)">
        </div>

        <div class="col-md-6">
          <label for="nascimento" class="form-label">Data de Nascimento</label>
          <input type="text" class="form-control" id="nascimento" placeholder="dd/mm/aaaa"
            onblur="validaNascimento(nascimento)" onkeypress="mascara('##/##/####', this, event, true)"
            maxlength="10" required>
        </div>
        <div class="col-md-6">
          <label for="bairro" class="form-label">Bairro</label>
          <input type="text" class="form-control" id="bairro" placeholder="Bairro"
            onblur="validaBairro(bairro)" maxlength="100" required>
        </div>
        <div class="col-md-6">
          <label for="endereco" class="form-label">Endereço</label>
          <input type="text" class="form-control" id="endereco" placeholder="Endereço"
            onblur="validaEndereco(endereco)" maxlength="100" required>
        </div>
        <div class="col-md-6">
          <label for="complemento" class="form-label">Complemento</label>
          <input type="text" class="form-control" id="complemento" placeholder="Complemento"
            onblur="validaComplemento(complemento)" maxlength="100" required>
        </div>
        <div class="col-md-6">
          <label for="rua" class="form-label">Rua</label>
          <input type="text" class="form-control" id="rua" placeholder="Rua"
            onblur="validaRua(rua)" maxlength="100" required>
        </div>
        <div class="col-md-6">
          <label for="cep" class="form-label">CEP</label>
          <input type="text" class="form-control" id="cep" placeholder="00000-000" onblur="validaCep(cep)"
            onkeypress="mascara('#####-###', this, event, true)" required>
        </div>
        <div class="col-md-6">
          <label for="rg" class="form-label">RG</label>
          <input type="text" class="form-control" id="rg" placeholder="00.000.000-0" onblur="validaRg(rg)"
            onkeypress="mascara('##.###.###-#', this, event, true)" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Gênero</label><br>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" name="genero"  id="masculino" value="Masculino">
            <label class="form-check-label" for="masculino" >Masculino</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" name="genero" id="feminino" value="Feminino">
            <label class="form-check-label" for="feminino">Feminino</label>
          </div>
        </div>

        <div class="col-md-6">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" onblur="validaSenha(senha,confirmar)" required>
        </div>
        <div class="col-md-6">
          <label for="confirmar" class="form-label">Confirmar Senha</label>
          <input type="password" class="form-control" id="confirmar" onblur="validaSenha(senha,confirmar)" required>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-3 mt-4">
        <button type="reset" class="btn btn-secondary" onclick="window.location.href='index.html'">Cancelar</button>
        <button type="submit" class="btn btn-primary" onclick="enviarForm()">Confirmar</button>
      </div>
    </form>
  </div>

  <!-- JS - Máscaras e validação -->
  <script src="valida.js"></script>
</body>

</html>
