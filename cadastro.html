<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - FarmaFipp</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="
https://cdn.jsdelivr.net/npm/sweetalert2@11.26.3/dist/sweetalert2.min.css
" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <!-- LOGO -->
      <a class="logo navbar-brand" href="index.html">FarmaFipp</a>
      <!-- BOTÃO TOGGLER PARA MOBILE -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    </div>
  </nav>
  <form action="">
    <div class="conteiner-form">
      <div class="email">
        <label for="email">Email</label>
        <div class="icon-controller">
          <div class="icons">
            <span><i class="fas fa-envelope"></i></span>
          </div>
          <input type="email" id="email" placeholder="Digite seu email" required />
        </div>
      </div>

      <div class="form-documents">
        <div class="controller">
          <label for="text">Nome</label>
          <input type="text" id="nome" class="input-style" placeholder="Digite seu nome completo" required />
        </div>
        <div class="controller">
          <label for="text">Sobrenome</label>
          <input type="text" id="sobrenome" class="input-style" placeholder="Digite seu sobrenome" required />
        </div>
      </div>
      <div class="form-documents">
        <div class="controller">
          <label for="rg">RG</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-id-card"></i></span>
            </div>
            <input type="text" id="rg" class="input-style" placeholder="Digite seu RG" required />
          </div>
        </div>

        <div class="controller">
          <label for="cpf">CPF</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-id-card"></i></span>
            </div>
            <input type="text" id="cpf" class="input-style" placeholder="Digite seu CPF" required />
          </div>
        </div>
      </div>
      <div class="form-documents">
        <div class="controller">
          <label for="phone">Telefone</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-phone"></i></span>
            </div>
            <input type="text" id="phone" class="input-style" placeholder="Digite seu telefone" required />
          </div>
        </div>
      </div>
      <div class="form-documents">
        <div class="controller">
          <label for="birthdate">Data de Nascimento</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-calendar-alt"></i></span>
            </div>
            <input type="text" id="birthdate" class="input-style" placeholder="DD/MM/AAAA" required />
          </div>
        </div>
      </div>
      <div class="form-documents">
        <div class="controller">
          <label for="address">Endereço</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-home"></i></span>
            </div>
            <input type="text" id="address" class="input-style" placeholder="Digite seu endereço completo" required />
          </div>
        </div>
        <div class="controller">
          <label for="number">Número</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-hashtag"></i></span>
            </div>
            <input type="text" id="number" class="input-style" placeholder="Número" required />
          </div>

        </div>
        <div class="controller">
          <label for="city">Cidade</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-city"></i></span>
            </div>
            <input type="text" id="city" class="input-style" placeholder="Digite sua cidade" required />
          </div>
        </div>
        <div class="controller">
          <label for="text">Complemento</label>
          <input type="text" id="complement" class="input-style" placeholder="Complemento (opcional)" />
        </div>
        <div class="controller">
          <label for="cep">CEP</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-map-marker-alt"></i></span>
            </div>
            <input type="text" id="cep" class="input-style" placeholder="Digite seu CEP" required />
          </div>
        </div>
      </div>
      <div class="form-documents">
        <div class="controller">
          <label for="text">Genero</label>
          <select id="gender" required>
            <option value="">Selecione seu gênero</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
          </select>
        </div>
      </div>
      <div class="form-documents">

        <div class="controller">
          <label for="password">Senha</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-lock"></i></span>
            </div>
            <input type="password" id="password" class="input-style" placeholder="Digite sua senha" required />
          </div>
        </div>

        <div class="controller">
          <label for="confirm-password">Confirmar Senha</label>
          <div class="icon-controller">
            <div class="icons">
              <span><i class="fas fa-lock"></i></span>
            </div>
            <input type="password" id="confirm-password" class="input-style" placeholder="Confirme sua senha"
              required />
          </div>
        </div>
      </div>

    </div>
  </form>
  <!-- JS - Máscaras e validação -->
  <script src="valida.js"></script>
</body>

</html>
