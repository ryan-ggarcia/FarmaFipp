<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro - FarmaFipp</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <header id="header-cad" class="d-flex justify-content-between align-items-center p-3 bg-light">
      <a class="logo navbar-brand" href="index.html" style="font-size: 2rem;">FarmaFipp</a>
    <div class="info-cad d-flex gap-4">
      <div><i class="fas fa-headset"></i> Central de Atendimento</div>
      <div><i class="fas fa-shield-halved"></i> Ambiente 100% Seguro</div>
    </div>
  </header>

  <div class="container my-5">
    <div class="top d-flex justify-content-between align-items-center mb-4">
      <h2><i class="fas fa-user"></i> Nova Conta</h2>
      <button class="btn btn-outline-primary" onclick="redirectToLogin()">Já tenho cadastro</button>
    </div>

    <form id="formCadastro" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="nome" class="form-label">Nome Completo</label>
          <input type="text" class="form-control" id="nome" required>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="col-md-6">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
        </div>
        <div class="col-md-6">
          <label for="celular" class="form-label">Celular</label>
          <input type="tel" class="form-control" id="celular" placeholder="(00) 00000-0000" required>
        </div>
        <div class="col-md-6">
          <label for="nascimento" class="form-label">Data de Nascimento</label>
          <input type="text" class="form-control" id="nascimento" placeholder="dd/mm/aaaa" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Gênero</label><br>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genero" id="masculino" value="Masculino">
            <label class="form-check-label" for="masculino">Masculino</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="genero" id="feminino" value="Feminino">
            <label class="form-check-label" for="feminino">Feminino</label>
          </div>
        </div>
        <div class="col-md-6">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" required>
        </div>
        <div class="col-md-6">
          <label for="confirmar" class="form-label">Confirmar Senha</label>
          <input type="password" class="form-control" id="confirmar" required>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-3 mt-4">
        <button type="reset" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Confirmar</button>
      </div>
    </form>
  </div>

  <!-- JS - Máscaras e validação -->
  <script>
    // Máscaras simples para CPF, celular e data
    document.getElementById("cpf").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    });

    document.getElementById("celular").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "")
        .replace(/(\d{2})(\d)/, "($1) $2")
        .replace(/(\d{5})(\d)/, "$1-$2")
        .slice(0, 15);
    });

    document.getElementById("nascimento").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "")
        .replace(/(\d{2})(\d)/, "$1/$2")
        .replace(/(\d{2})(\d)/, "$1/$2")
        .slice(0, 10);
    });

    // Redireciona para login
    function redirectToLogin() {
      window.location.href = "login.html";
    }

    // Validação
    document.getElementById("formCadastro").addEventListener("submit", function (e) {
      e.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const cpf = document.getElementById("cpf").value.trim();
      const celular = document.getElementById("celular").value.trim();
      const nascimento = document.getElementById("nascimento").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmar = document.getElementById("confirmar").value;

      if (!nome || !email || !cpf || !celular || !nascimento || !senha || !confirmar) {
        Swal.fire("Atenção", "Por favor, preencha todos os campos!", "warning");
        return;
      }

      if (senha !== confirmar) {
        Swal.fire("Erro", "As senhas não coincidem!", "error");
        return;
      }

      Swal.fire("Sucesso!", "Cadastro realizado com sucesso!", "success");
      // Aqui você pode enviar os dados com fetch/AJAX
    });
  </script>
</body>
</html>
